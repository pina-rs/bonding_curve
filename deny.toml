[graph]
all-features = true

[advisories]
db-path = "target/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db.git"]
ignore = [
	# solana-rpc-client depends on bincode 1.3.3, which is flagged as
	# unmaintained. Only the CLI links it; remove once solana-client upgrades.
	{ id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is a transitive dependency of solana-rpc-client" },
	# The SDK still requires zstd 0.13 / zstd-safe 7. These API-specific
	# findings are unreachable in the pinned RPC account decoder; the exact
	# call paths, selected features, and removal criteria are documented in
	# docs/security.md. zstd-sys is upgraded rather than excepted.
	{ id = "RUSTSEC-2026-0391", reason = "RPC decoding constructs a fresh owned read::Decoder per account; no borrowed with_context API is used" },
	{ id = "RUSTSEC-2026-0398", reason = "zstd-safe seekable feature is absent from the workspace graph, so the affected API is not compiled" },
	{ id = "RUSTSEC-2026-0403", reason = "RPC decoding uses read::Decoder, which the advisory explicitly identifies as unaffected; write::Decoder is not used" },
]

[bans]
# The CLI links the Solana host stack, which pulls two trains of several crates
# (solana-pubkey 3 and 4, syn 2 and 3, sha2 0.10 and 0.11, ...). The on-chain
# program's graph is tiny and pinned through `pina`; duplicates elsewhere are
# expected and not actionable here.
multiple-versions = "allow"
wildcards = "deny"
# The unpublished program depends on the vendored AMM CPI crate by path alone.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Permissive licenses used by the host-side dependency graph (CLI and
# clients). The on-chain program links none of these.
[licenses]
version = 2
allow = [
	"0BSD",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"BSL-1.0",
	"CDLA-Permissive-2.0",
	"ISC",
	"MIT",
	"Unicode-3.0",
	"Unlicense",
	"Zlib",
]
