[package]
name = "pina_bonding_curve_client"
version.workspace = true
categories = ["cryptography::cryptocurrencies"]
edition.workspace = true
homepage.workspace = true
keywords = ["solana", "bonding-curve", "pina", "client", "launchpad"]
license.workspace = true
repository = "https://github.com/pina-rs/bonding_curve/tree/main/clients/rust/pina_bonding_curve"
rust-version.workspace = true
description = "Rust client for the Pina Bonding Curve: instruction builders, account decoders, PDAs, events, and errors"

[dependencies]
num-derive = { workspace = true }
num-traits = { workspace = true }
pina = { workspace = true }
solana-instruction = { workspace = true }
solana-program-error = { workspace = true }
solana-pubkey = { workspace = true, features = ["curve25519"] }
thiserror = { workspace = true }

# Generated by `pina generate`. The source is reviewed through the IDL, not
# linted against the workspace's hand-written-code policy; only the lints the
# renderer's output is known to trip are relaxed here.
[lints.clippy]
unnecessary_cast = "allow"
