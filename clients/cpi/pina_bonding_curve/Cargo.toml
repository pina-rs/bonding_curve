[package]
name = "pina_bonding_curve_cpi"
version = "0.1.0"
categories = ["cryptography::cryptocurrencies", "no-std"]
edition.workspace = true
homepage.workspace = true
keywords = ["solana", "bonding-curve", "pina", "cpi", "launchpad"]
license.workspace = true
repository = "https://github.com/pina-rs/bonding_curve/tree/main/clients/cpi/pina_bonding_curve"
rust-version.workspace = true
description = "no_std CPI client for calling the Pina Bonding Curve from other on-chain Solana programs"

[dependencies]
pina = { workspace = true }

# Generated by `pina generate`. The source is reviewed through the IDL, not
# linted against the workspace's hand-written-code policy; only the lints the
# renderer's output is known to trip are relaxed here.
[lints.rust]
unused_assignments = "allow"

[lints.clippy]
needless_borrow = "allow"
unnecessary_cast = "allow"
